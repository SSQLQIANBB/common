name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-publish.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'packages/**'
      - 'types/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm
        run: |
          npm install --global npm@^11.5.1
          node --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Resolve publish version
        id: version
        run: |
          local_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")

          if npm view @sycsq/common@latest version > /dev/null 2>&1; then
            npm_version=$(npm view @sycsq/common@latest version)
          else
            npm_version=""
          fi

          next_version=$(LOCAL_VERSION="$local_version" NPM_VERSION="$npm_version" node - <<'NODE'
          const fs = require('fs');
          const local = process.env.LOCAL_VERSION;
          const published = process.env.NPM_VERSION;
          const parse = value => value.split('.').map(Number);
          const compare = (a, b) => {
            const left = parse(a);
            const right = parse(b);
            for (let index = 0; index < 3; index += 1) {
              if (left[index] > right[index]) return 1;
              if (left[index] < right[index]) return -1;
            }
            return 0;
          };

          let next = local;
          if (published && compare(local, published) <= 0) {
            const [major, minor, patch] = parse(published);
            next = [major, minor, patch + 1].join('.');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = next;
            fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

            if (fs.existsSync('package-lock.json')) {
              const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              packageLock.version = next;
              if (packageLock.packages && packageLock.packages['']) {
                packageLock.packages[''].version = next;
              }
              fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`);
            }
          }

          console.log(next);
          NODE
          )

          if [ "$next_version" != "$local_version" ]; then
            echo "version_bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "new_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.version.outputs.version_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        run: npm publish --access public --provenance

      - name: Publish to GitHub Packages
        run: |
          {
            echo "@ssqlqianbb:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> "$NPM_CONFIG_USERCONFIG"

          npm pkg set name="@ssqlqianbb/common"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          target_commitish: ${{ steps.release-commit.outputs.sha }}
          body: |
            Automated package release.

            - Version: v${{ steps.version.outputs.new_version }}
            - Commit: ${{ steps.release-commit.outputs.sha }}
            - Tests: pnpm test
            - Build: pnpm build
            - npmjs: @sycsq/common
            - GitHub Packages: @ssqlqianbb/common
            - Provenance: npm publish --provenance
