name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'packages/**'
      - 'types/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Resolve publish version
        id: version
        run: |
          local_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")

          if npm view @sycsq/common@latest version > /dev/null 2>&1; then
            npm_version=$(npm view @sycsq/common@latest version)
          else
            npm_version=""
          fi

          if [ "$npm_version" = "$local_version" ]; then
            node scripts/version.js patch
            local_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
            echo "version_bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "new_version=$local_version" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated package release.

            - Version: v${{ steps.version.outputs.new_version }}
            - Commit: ${{ github.sha }}
            - Tests: pnpm test
            - Build: pnpm build
