name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-publish.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'packages/**'
      - 'types/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          always-auth: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Verify NPM authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret NPM_TOKEN is missing. Create an npm automation/granular access token from the npm account that maintains @sycsq/common, then save it as the repository secret NPM_TOKEN."
            exit 1
          fi

          npm_user=$(npm whoami --registry=https://registry.npmjs.org/ 2>/tmp/npm-whoami.log) || {
            cat /tmp/npm-whoami.log
            echo "::error::npm whoami failed. Recreate NPM_TOKEN from the npm account 'ssqlqianbb' and make sure the token can publish @sycsq/common."
            exit 1
          }
          echo "Authenticated npm user: $npm_user"

          if npm view @sycsq/common@latest version --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
            owners=$(npm owner ls @sycsq/common --registry=https://registry.npmjs.org/)
            echo "$owners"

            if ! echo "$owners" | grep -Eq "^${npm_user} "; then
              echo "::error::NPM_TOKEN belongs to '$npm_user', but that user is not a maintainer of @sycsq/common. Create NPM_TOKEN from the npm account listed by 'npm owner ls @sycsq/common'."
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve publish version
        id: version
        run: |
          local_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")

          if npm view @sycsq/common@latest version > /dev/null 2>&1; then
            npm_version=$(npm view @sycsq/common@latest version)
          else
            npm_version=""
          fi

          next_version=$(LOCAL_VERSION="$local_version" NPM_VERSION="$npm_version" node - <<'NODE'
          const fs = require('fs');
          const local = process.env.LOCAL_VERSION;
          const published = process.env.NPM_VERSION;
          const parse = value => value.split('.').map(Number);
          const compare = (a, b) => {
            const left = parse(a);
            const right = parse(b);
            for (let index = 0; index < 3; index += 1) {
              if (left[index] > right[index]) return 1;
              if (left[index] < right[index]) return -1;
            }
            return 0;
          };

          let next = local;
          if (published && compare(local, published) <= 0) {
            const [major, minor, patch] = parse(published);
            next = [major, minor, patch + 1].join('.');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            packageJson.version = next;
            fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

            if (fs.existsSync('package-lock.json')) {
              const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              packageLock.version = next;
              if (packageLock.packages && packageLock.packages['']) {
                packageLock.packages[''].version = next;
              }
              fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`);
            }
          }

          console.log(next);
          NODE
          )

          if [ "$next_version" != "$local_version" ]; then
            echo "version_bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "new_version=$next_version" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.version.outputs.version_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          target_commitish: ${{ steps.release-commit.outputs.sha }}
          body: |
            Automated package release.

            - Version: v${{ steps.version.outputs.new_version }}
            - Commit: ${{ steps.release-commit.outputs.sha }}
            - Tests: pnpm test
            - Build: pnpm build
            - Provenance: pnpm publish --provenance
